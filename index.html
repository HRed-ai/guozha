<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>过闸 · 大运河八闸</title>
<meta name="description" content="八枚 NFC 木纹书签，对应大运河八座闸坝。碰签入闸，读完过闸。">
<meta name="theme-color" content="#101012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="rod top"></div>
    <div class="scroll-head"></div>

    <div class="painting">
      <div class="paper"></div>
      <div class="grain"></div>
      <div class="vignette"></div>

      <svg id="map" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="inkbleed" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
          <filter id="brush" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
        </defs>
        <g id="land"></g>
        <g id="mountain"></g>
        <g id="canal"></g>
        <g id="locks"></g>
      </svg>

      <div class="frame"><div class="frame-inner"></div></div>

      <header id="hud">
        <div class="title">过闸</div>
        <div class="sub">大運河八閘圖</div>
        <div class="seal"><span>過</span><span>閘</span></div>
      </header>

      <aside id="colophon" aria-hidden="true"></aside>

      <footer id="legend">
        <span class="dot gold"></span>運河
        <span class="dot red"></span>八閘
        <button id="mk-add" type="button" title="点地图上任一处，加一个自己的闸">＋ 私閘</button>
        <span class="hint">拖动平移 · 滚轮缩放</span>
      </footer>
    </div>

    <div class="scroll-foot"></div>
    <div class="rod bottom"></div>

    <section id="station" aria-hidden="true">
      <div class="st-paper"></div>
      <div class="st-frame"></div>
      <div class="st-inner">
        <header class="st-head">
          <button class="st-back" type="button">← 八閘總圖</button>
          <div class="st-name"><span class="st-ch"></span><h2></h2></div>
          <div class="st-seqn"></div>
          <div class="st-meta"></div>
        </header>
        <div class="st-body">
          <figure class="st-scene">
            <img alt="">
            <figcaption></figcaption>
          </figure>
          <div class="st-rail">
            <div class="st-rail-top">
              <div class="st-verse"></div>
              <ul class="st-facts"></ul>
            </div>
            <div class="st-checkin" aria-hidden="true"></div>
          </div>
          <figure class="st-figure">
            <img alt="">
            <div class="st-bubble" aria-hidden="true"></div>
          </figure>
        </div>
        <footer class="st-foot">
          <button class="st-prev" type="button">← 上一閘</button>
          <div class="st-track"></div>
          <button class="st-next" type="button">下一閘 →</button>
        </footer>
      </div>
      <div class="st-gate" aria-hidden="true"></div>
    </section>

    <section id="custom" aria-hidden="true">
      <div class="cu-paper st-paper"></div>
      <div class="cu-frame st-frame"></div>
      <div class="cu-inner">
        <header class="cu-head st-head">
          <button class="cu-back st-back" type="button">← 八閘總圖</button>
          <div class="cu-title">
            <span class="cu-seqn">第 九 閘</span>
            <input class="cu-name" type="text" maxlength="12" placeholder="给这一闸起个名">
          </div>
          <div class="cu-tools">
            <button type="button" data-act="edit" class="view-only">編 輯</button>
            <button type="button" data-act="text" class="edit-only">＋ 文字</button>
            <button type="button" data-act="image" class="edit-only">＋ 圖片</button>
            <button type="button" data-act="bg" class="edit-only">換背景</button>
            <button type="button" data-act="png">存為圖片</button>
            <button type="button" data-act="export" class="edit-only">匯出</button>
            <button type="button" data-act="import" class="edit-only">匯入</button>
            <button type="button" data-act="done" class="edit-only">完 成</button>
            <button type="button" data-act="del" class="cu-danger edit-only">刪除此閘</button>
          </div>
        </header>
        <div class="cu-body">
          <div class="cu-stage">
            <div class="cu-canvas" tabindex="0"></div>
          </div>
          <aside class="cu-aside">
            <div class="st-checkin cu-checkin"></div>
          </aside>
        </div>
        <footer class="cu-foot">
          <button class="cu-prev st-back" type="button">← 上一閘</button>
          <span class="cu-hint">拖动移动 · 右下角拖动＝缩放（文字连字号一起变）· Ctrl+滚轮细调 · 双击改字 · Delete 删除</span>
          <button class="cu-next st-back" type="button">下一閘 →</button>
        </footer>
      </div>
      <input type="file" class="cu-file" accept="image/*" hidden>
      <input type="file" class="cu-json" accept="application/json,.json" hidden>
    </section>
  </div>
  <script src="data/china_geo.js" onerror="window.__noRealGeo=1"></script>
  <script src="data/geo.js"></script>
  <script src="data/stations.js"></script>
  <script src="data/poems.js"></script>
  <script src="ledger.js"></script>
  <script src="station.js"></script>
  <script src="app.js"></script>
  <script src="custom.js"></script>
  <script>
  /* 网站形态：注册 Service Worker，断网也能打开 */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('SW 注册失败：', e && e.message);
      });
    });
  }
  </script>
</body>
</html>
